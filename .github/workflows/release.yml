name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.5.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version and release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content -Raw Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag must match Directory.Build.props version' }
          $notes = "docs/releases/$($env:RELEASE_TAG).md"
          if (!(Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Run layout tests
        shell: pwsh
        run: |
          dotnet run --project tests/WindowTiler.Core.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Layout tests failed' }
      - name: Publish portable application
        shell: pwsh
        run: |
          dotnet publish src/WindowTiler.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:IncludeSourceRevisionInInformationalVersion=false -o artifacts/release-build
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Package release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $exe = Get-Item artifacts/release-build/WindowTiler.exe
          if ($exe.VersionInfo.ProductVersion -cne $version) { throw 'EXE version mismatch' }
          New-Item -ItemType Directory -Force artifacts/release, artifacts/portable-package | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination "artifacts/release/WindowTiler-$version.exe"
          Copy-Item -LiteralPath $exe.FullName -Destination artifacts/portable-package/WindowTiler.exe
          Copy-Item -LiteralPath LICENSE -Destination artifacts/portable-package/LICENSE
          Copy-Item -LiteralPath docs/PORTABLE.md -Destination artifacts/portable-package/README.md
          Compress-Archive -Path artifacts/portable-package/* -DestinationPath "artifacts/release/WindowTiler-$version-win-x64.zip"
          $checksums = Get-ChildItem artifacts/release -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Encoding utf8NoBOM artifacts/release/SHA256SUMS.txt
      - name: Upload and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { throw 'Release is already published; refusing to replace its assets' }
          } else {
            gh release create $tag --verify-tag --draft --title "铺窗 v$env:RELEASE_VERSION" --notes-file "docs/releases/$tag.md"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          }
          $assets = @(Get-ChildItem artifacts/release -File | ForEach-Object { $_.FullName })
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release left as draft' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
